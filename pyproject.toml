[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-self"
version = "0.1.0"
description = "A Symphony service implementation."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
symphony = "symphony.cli:main"

[tool.setuptools.packages.find]
include = ["symphony*"]
